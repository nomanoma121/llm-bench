# Generated by `llmbench job form benchmark > .github/ISSUE_TEMPLATE/benchmark.yml`.
name: Benchmark
description: Measure a model and runtime once and open a PR with the result
title: '[benchmark] '
labels:
  - llmbench:benchmark
body:
  - type: dropdown
    id: preset
    attributes:
      label: Preset
      description: Model, runtime and arguments known to run on the GPU node.
      options:
        - llama.cpp · Qwen3.8-27B Q4_0
        - llama.cpp · Flash-Next UD-Q4_K_XL · 1GPU
        - llama.cpp · Flash-Next UD-Q4_K_XL · 2GPU
        - strata · Flash-Next IQ2_XS · 1GPU
        - strata · Flash-Next IQ2_XS · 2GPU
        - strata · Flash-Next IQ2_XS 64K · 2GPU
        - strata · Flash-Next UD-Q4_K_XL · 1GPU
        - freetoken · Flash-Next NVFP4 · 1GPU
      default: 0
    validations:
      required: true
  - type: dropdown
    id: benchmark
    attributes:
      label: Benchmark
      description: A directory under benchmarks/.
      options:
        - visual
        - visual-agent
      default: 0
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: Run the prompt through a coding agent instead of a direct request.
      options:
        - none
        - opencode
        - pi
        - dsh
        - hermes
      default: 0
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Reasoning effort
      options:
        - default
        - none
        - low
        - medium
        - high
      default: 2
    validations:
      required: true
  - type: input
    id: max_tokens
    attributes:
      label: Max tokens
      description: Caps a direct request; unused with a harness.
      value: "28672"
  - type: input
    id: repeats
    attributes:
      label: Repeats
      value: "1"
  - type: checkboxes
    id: skip_metrics
    attributes:
      label: Leave out metrics
      options:
        - label: runtime
        - label: gpu
        - label: host
  - type: input
    id: args
    attributes:
      label: Extra runtime args
      description: Appended to the preset's runtime arguments, split on spaces.
  - type: textarea
    id: override
    attributes:
      label: Spec override
      description: Job spec YAML laid over what the fields above build. Check it locally with `llmbench job validate`.
      render: yaml
  - type: textarea
    id: notes
    attributes:
      label: Notes
