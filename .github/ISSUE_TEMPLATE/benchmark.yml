name: Benchmark
description: Measure a model and runtime once and open a PR with the result
title: "[benchmark] "
labels: ["llmbench:benchmark"]
body:
  - type: textarea
    id: jobspec
    attributes:
      label: Job spec
      description: Check it locally with `llmbench job validate`.
      render: yaml
      value: |
        kind: benchmark
        model: Qwen3.8-27B/Qwen3.8-27B-Q4_0.gguf
        runtime:
          engine: llamacpp
          args: ["--ctx-size", "8192"]
        workload:
          - name: short
            prompt: benchmarks/visual/prompt.md
            max_tokens: 256
            repeats: 3
        sampling:
          temperature: 0
          seed: 1
        metrics: [runtime, gpu, host]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
