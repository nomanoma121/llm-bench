name: Benchmark
description: Measure a model and runtime once and open a PR with the result
title: "[benchmark] "
labels: ["llmbench:benchmark"]
body:
  - type: textarea
    id: jobspec
    attributes:
      label: Job spec
      description: Check it locally with `llmbench job validate`.
      render: yaml
      value: |
        kind: benchmark
        model: Qwen3.8-27B/Qwen3.8-27B-Q4_0.gguf
        runtime:
          engine: llamacpp
          args: ["--ctx-size", "32768"]
        workload:
          - name: visual
            prompt: benchmarks/visual/prompt.md
            max_tokens: 28672
            repeats: 1
            # harness: opencode   # or pi, dsh, hermes: run through a coding agent (max_tokens then unused)
        sampling:
          temperature: 0
          seed: 1
          reasoning_effort: low
        metrics: [runtime, gpu, host]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
