# Generated by `llmbench job form optimize > .github/ISSUE_TEMPLATE/optimize.yml`.
name: Optimize
description: Let the agent optimize a runtime on the GPU sandbox and open a PR
title: '[optimize] '
labels:
  - llmbench:optimize
body:
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Qwen3.8-27B Q4_0
        - Flash-Next UD-Q4_K_XL
        - Flash-Next IQ2_XS
        - Flash-Next NVFP4
      default: 0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - llamacpp
        - strata
        - freetoken
      default: 0
    validations:
      required: true
  - type: dropdown
    id: gpus
    attributes:
      label: GPUs
      options:
        - "1"
        - "2"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Context
      options:
        - default
        - 32K
        - 64K
        - 128K
      default: 1
    validations:
      required: true
  - type: dropdown
    id: mtp
    attributes:
      label: MTP
      description: Speculative decoding with the model's multi-token prediction head.
      options:
        - default
        - "on"
        - "off"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: kv_cache
    attributes:
      label: KV cache
      options:
        - default
        - f16
        - q8_0
        - q4_0
      default: 0
    validations:
      required: true
  - type: dropdown
    id: experts_on_cpu
    attributes:
      label: Experts on CPU
      description: Keep the MoE experts in host memory.
      options:
        - default
        - "on"
        - "off"
      default: 0
    validations:
      required: true
  - type: input
    id: runtime_args
    attributes:
      label: Extra runtime args
      description: Passed to the engine as they are, split like a shell does.
  - type: dropdown
    id: benchmark
    attributes:
      label: Benchmark
      options:
        - visual
      default: 0
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: Run the prompt through a coding agent instead of a direct request.
      options:
        - none
        - opencode
        - pi
        - dsh
        - hermes
      default: 0
    validations:
      required: true
  - type: input
    id: harness_args
    attributes:
      label: Extra harness args
      description: Passed to the harness before the task.
  - type: dropdown
    id: effort
    attributes:
      label: Reasoning effort
      options:
        - default
        - none
        - low
        - medium
        - high
      default: 2
    validations:
      required: true
  - type: input
    id: max_tokens
    attributes:
      label: Max tokens
      description: Caps a direct request; unused with a harness.
      value: "28672"
  - type: checkboxes
    id: skip_metrics
    attributes:
      label: Leave out metrics
      options:
        - label: runtime
        - label: gpu
        - label: host
  - type: input
    id: repo
    attributes:
      label: Source repository
      value: ggml-org/llama.cpp
  - type: input
    id: ref
    attributes:
      label: Source ref
      value: master
  - type: input
    id: max_rounds
    attributes:
      label: Max rounds
      value: "20"
  - type: textarea
    id: override
    attributes:
      label: Spec override
      description: Job spec YAML laid over what the fields above build.
      render: yaml
  - type: textarea
    id: notes
    attributes:
      label: Notes
