name: Optimize
description: Let the harness optimize a runtime on the GPU sandbox and open a PR
title: "[optimize] "
labels: ["llmbench:optimize"]
body:
  - type: textarea
    id: jobspec
    attributes:
      label: Job spec
      description: Check it locally with `llmbench job validate`.
      render: yaml
      value: |
        kind: optimize
        model: Qwen3.8-27B/Qwen3.8-27B-Q4_0.gguf
        runtime:
          engine: llamacpp
          args: ["--ctx-size", "8192"]
        workload:
          - name: short
            prompt: benchmarks/visual/prompt.md
            max_tokens: 256
            repeats: 3
        sampling:
          temperature: 0
          seed: 1
        metrics: [runtime, gpu, host]
        source:
          repo: ggml-org/llama.cpp
          ref: master
        budget:
          max_rounds: 20
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
