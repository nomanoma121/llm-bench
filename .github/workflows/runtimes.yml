name: runtimes

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: [llama-cpp, vllm, freetoken, strata]
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --remote --depth 1 runtimes/${{ matrix.runtime }}/upstream
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RUNTIMES_PR_TOKEN }}
          branch: chore/runtime-${{ matrix.runtime }}
          add-paths: runtimes/${{ matrix.runtime }}/upstream
          commit-message: "chore: update ${{ matrix.runtime }} upstream"
          title: "chore: update ${{ matrix.runtime }} upstream"
          body: Follows the upstream default branch of `runtimes/${{ matrix.runtime }}/upstream`. This PR is updated daily until it is merged.
          delete-branch: true
