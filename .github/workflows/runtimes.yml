name: runtimes

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: [llama-cpp, vllm, freetoken]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.runtime != 'llama-cpp'
        run: git submodule update --init --remote --depth 1 runtimes/${{ matrix.runtime }}/upstream
      - if: matrix.runtime == 'llama-cpp'
        run: |
          tag=$(python3 .github/scripts/llama-cpp-image-tag.py)
          git submodule update --init --depth 1 runtimes/llama-cpp/upstream
          git -C runtimes/llama-cpp/upstream fetch --depth 1 origin tag "$tag"
          git -C runtimes/llama-cpp/upstream checkout "$tag"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RUNTIMES_PR_TOKEN }}
          branch: chore/runtime-${{ matrix.runtime }}
          add-paths: runtimes/${{ matrix.runtime }}/upstream
          commit-message: "chore: update ${{ matrix.runtime }} upstream"
          title: "chore: update ${{ matrix.runtime }} upstream"
          body: "Follows `runtimes/${{ matrix.runtime }}/upstream` (llama.cpp: the newest build with a published CUDA 13 server image; others: the default branch). This PR is updated daily until it is merged."
          delete-branch: true
