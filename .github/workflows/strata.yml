name: strata

on:
  push:
    paths:
      - "runtimes/strata/**"
      - ".github/workflows/strata.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/strata
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 runtimes/strata/upstream
      # The CUDA devel image and the engine build need more disk than the runner has free.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      # This commit pins both the upstream submodule and runtimes/strata/Dockerfile.
      - run: echo "TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      # Only the RTX 3060 (sm_86) and no image encoder.
      - run: docker build -t strata-upstream --build-arg CUDA_ARCHITECTURES=86 --build-arg BUILD_VISION=0 runtimes/strata/upstream
      - run: docker build -t "$IMAGE:$TAG" --build-arg BASE=strata-upstream runtimes/strata
      - run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: docker push "$IMAGE:$TAG"
      - if: github.ref == 'refs/heads/main'
        run: docker tag "$IMAGE:$TAG" "$IMAGE:latest" && docker push "$IMAGE:latest"
