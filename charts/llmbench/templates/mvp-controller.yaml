{{- if .Values.mvp.enabled }}
{{- $mvp := .Values.mvp }}
{{- $name := include "llmbench.fullname" . | trunc 50 | trimSuffix "-" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-operator
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  operator.yaml: |
    repository: {{ required "mvp.repository is required (owner/name)" $mvp.repository | quote }}
    default_branch: {{ $mvp.defaultBranch | quote }}
    labels:
      benchmark: {{ $mvp.labels.benchmark | quote }}
      optimize: {{ $mvp.labels.optimize | quote }}
      claimed: {{ $mvp.labels.claimed | quote }}
      done: {{ $mvp.labels.done | quote }}
      failed: {{ $mvp.labels.failed | quote }}
    lease:
      namespace: {{ $mvp.lease.namespace | quote }}
      name: {{ $mvp.lease.name | quote }}
      duration_seconds: {{ $mvp.lease.durationSeconds }}
    gitops:
      owner: {{ required "mvp.gitops.owner is required" $mvp.gitops.owner | quote }}
      repository: {{ required "mvp.gitops.repository is required" $mvp.gitops.repository | quote }}
      base_branch: {{ $mvp.gitops.baseBranch | quote }}
      file_path: {{ required "mvp.gitops.filePath is required" $mvp.gitops.filePath | quote }}
      yaml_path:
{{ toYaml $mvp.gitops.yamlPath | indent 8 }}
      active_value: {{ $mvp.gitops.activeValue | quote }}
      paused_value: {{ $mvp.gitops.pausedValue | quote }}
      application:
        namespace: {{ $mvp.gitops.application.namespace | quote }}
        name: {{ required "mvp.gitops.application.name is required" $mvp.gitops.application.name | quote }}
      workload:
        namespace: {{ $mvp.gitops.workload.namespace | quote }}
        deployment: {{ required "mvp.gitops.workload.deployment is required" $mvp.gitops.workload.deployment | quote }}
        active_replicas: {{ $mvp.gitops.workload.activeReplicas }}
    sandbox:
      namespace: {{ $mvp.sandbox.namespace | quote }}
      warm_pool: {{ required "mvp.sandbox.warmPool is required" $mvp.sandbox.warmPool | quote }}
      llmbench:
{{ toYaml $mvp.sandbox.llmbench | indent 8 }}
    models:
{{ toYaml $mvp.models | indent 6 }}
    engines:
{{ toYaml $mvp.engines | indent 6 }}
    images:
{{ toYaml $mvp.images | indent 6 }}
    output_roots:
{{ toYaml $mvp.outputRoots | indent 6 }}
    max_rounds: {{ $mvp.maxRounds }}
    github_app:
      app_id: {{ $mvp.githubApp.appId }}
      installation_id: {{ $mvp.githubApp.installationId }}
      private_key_file: /etc/llmbench/keys/{{ $mvp.githubApp.privateKeyKey }}
{{- if $mvp.githubApp.baseUrl }}
      base_url: {{ $mvp.githubApp.baseUrl | quote }}
{{- end }}
    poll_interval_seconds: {{ $mvp.pollIntervalSeconds }}
    recovery_interval_seconds: {{ $mvp.recoveryIntervalSeconds }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# One namespaced Role per namespace the controller actually touches. A single
# Role in the lease namespace would leave the Argo CD and workload checks
# Forbidden, and a ClusterRole would grant more than this design needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-lease
  namespace: {{ $mvp.lease.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-lease
  namespace: {{ $mvp.lease.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# The sandbox namespace: create and delete the claim, watch it become ready,
# and reach the sandbox through port-forward.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-sandbox
  namespace: {{ $mvp.sandbox.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-sandbox
  namespace: {{ $mvp.sandbox.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# The GitOps side: the Application's sync status and the workload's
# replicas/Pods decide whether a pause or restore has converged.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-gitops-app
  namespace: {{ $mvp.gitops.application.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-gitops-app
  namespace: {{ $mvp.gitops.application.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-gitops-app
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-gitops-workload
  namespace: {{ $mvp.gitops.workload.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-gitops-workload
  namespace: {{ $mvp.gitops.workload.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-gitops-workload
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if and $mvp.agentServiceAccount.namespace $mvp.agentServiceAccount.name }}
---
# The Agent Pod (an existing DSH deployment) reaches the sandbox through the
# same port-forward transport as a human does. Its access is read-only plus
# port-forward: the completion record is a file inside the sandbox, so the
# Agent never needs to mutate a SandboxClaim (Kubernetes RBAC cannot restrict
# an update to annotations, so a write permission would let a compromised
# Agent rewrite the sandbox spec), and it never touches the lease or the
# GitOps manifest.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-agent
  namespace: {{ $mvp.sandbox.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-agent
  namespace: {{ $mvp.sandbox.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ $mvp.agentServiceAccount.name }}
    namespace: {{ $mvp.agentServiceAccount.namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "llmbench.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # One replica: the MVP keeps one job in flight and its state in the GPU
  # lease, and leader election is deliberately not implemented.
  replicas: 1
  strategy:
    # A rolling update would overlap two controllers; the lease fences them,
    # but a recreate keeps the picture simple for a single-flight loop.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llmbench.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llmbench.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      containers:
        - name: controller
          image: "{{ required "mvp.image.repository is required" $mvp.image.repository }}:{{ $mvp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $mvp.image.pullPolicy }}
          args: ["controller", "run", "--config", "/etc/llmbench/operator.yaml"]
          env:
            # The Pod name is the lease holder identity: it is what makes
            # another instance's live lease distinguishable from our own
            # interrupted one.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- with $mvp.extraEnv }}
{{ toYaml . | indent 12 }}
{{- end }}
          volumeMounts:
            - name: operator
              mountPath: /etc/llmbench
              readOnly: true
            # A Secret mounted inside the ConfigMap mount: the operator config
            # refers to the key by path, and the controller never reads the
            # Secret API itself.
            - name: github-app
              mountPath: /etc/llmbench/keys
              readOnly: true
          resources:
{{ toYaml $mvp.resources | indent 12 }}
      volumes:
        - name: operator
          configMap:
            name: {{ $name }}-operator
        - name: github-app
          secret:
            secretName: {{ required "mvp.githubApp.existingSecret is required: the Secret holding the App private key" $mvp.githubApp.existingSecret }}
      {{- with $mvp.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $mvp.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
