nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

githubAppSecret: ""

agentServiceAccount:
  namespace: ""
  name: ""

config:
  repository: ""
  branch: main
  github_app:
    app_id: 0
    installation_id: 0
    private_key_file: /etc/llmbench/keys/private-key.pem
  models: {}
  sandbox:
    namespace: llmbench
    warm_pool: ""
    workdir: /workspace/llm-bench
    llmbench: [llmbench]
  gitops:
    repository: ""
    branch: main
    file: ""
    path: []
    active_value: "1"
    paused_value: "0"
    application:
      namespace: argocd
      name: ""
    deployment:
      namespace: ""
      name: ""
      replicas: 1
  harness:
    namespace: ""
    pod_selector: ""
    command: [dsh, --profile, acp]
    cwd: /workspace
  poll_interval_seconds: 15
  pause_timeout_minutes: 30

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
