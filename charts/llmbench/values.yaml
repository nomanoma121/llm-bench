nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/nomanoma121/llmbench
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

githubAppSecret: ""

# The ServiceAccount the optimize agent (opencode) runs as; it may use the
# sandboxes.
agentServiceAccount:
  namespace: ""
  name: ""

# Secret with OPENCODE_SERVER_PASSWORD, the agent server's basic auth.
agentSecret: ""

config:
  repository: ""
  branch: main
  github_app:
    app_id: 0
    installation_id: 0
    private_key_file: /etc/llmbench/keys/private-key.pem
  sandbox:
    namespace: llmbench
    warm_pool: ""
    workdir: /workspace/llm-bench
    llmbench: [llmbench]
  gitops:
    repository: ""
    branch: main
    file: ""
    path: []
    active_value: "1"
    paused_value: "0"
    application:
      namespace: argocd
      name: ""
    deployment:
      namespace: ""
      name: ""
      replicas: 1
  agent:
    url: ""
    username: opencode
    # provider/model for optimize sessions; empty uses the server's default
    model: ""
  poll_interval_seconds: 15
  pause_timeout_minutes: 30

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
