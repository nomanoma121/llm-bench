targets:
  gpu:
    gitops:
      owner: example-owner
      repository: example-manifests
      base_branch: main
      file_path: apps/inference/values.yaml
      yaml_path: [replicaCount]
      active_value: "1"
      paused_value: "0"
      application:
        namespace: argocd
        name: local-inference
      workload:
        namespace: inference
        deployment: local-inference
        active_replicas: 1
    sandbox:
      namespace: bench
      warm_pool: demo-llmbench
site:
  owner: example-owner
  repository: llm-bench-site
  branch: gh-pages
  base_url: https://example-owner.github.io/llm-bench-site
  extra_files:
    _headers: |
      /*
        Content-Security-Policy: default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'
review:
  owner: example-owner
  repository: llm-bench
  public_base_url: https://example-owner.github.io/llm-bench-site
  bot_login: bench-app[bot]
  discord_webhook_env: LLMBENCH_DISCORD_WEBHOOK
