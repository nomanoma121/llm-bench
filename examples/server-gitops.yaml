targets:
  gpu:
    gitops:
      owner: example-owner
      repository: example-manifests
      base_branch: main
      file_path: apps/inference/values.yaml
      yaml_path: [replicaCount]
      active_value: "1"
      paused_value: "0"
      application:
        namespace: argocd
        name: local-inference
      workload:
        namespace: inference
        deployment: local-inference
        active_replicas: 1
    sandbox:
      namespace: bench
      warm_pool: demo-llmbench

# Candidate previews. The controller serves a run's output/ directory on a
# separate listener (serve --preview-addr) and only derives the URLs that the
# Issue links to from base_url; it never publishes to a public host. Put an
# Ingress that terminates cluster authentication (OIDC) in front of the
# listener and bind it with --preview-public.
preview:
  base_url: https://llmbench-preview.example.internal

review:
  owner: example-owner
  repository: llm-bench
  bot_login: bench-app[bot]
  discord_webhook_env: LLMBENCH_DISCORD_WEBHOOK
