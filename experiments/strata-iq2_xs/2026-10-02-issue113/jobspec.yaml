kind: benchmark
model: strata/config/strata-iq2_xs.json
runtime:
    engine: strata
    args:
        - --gpu
        - 0,1
    ready_timeout_seconds: 1800
workload:
    - name: visual
      prompt: benchmarks/visual/prompt.md
      max_tokens: 28672
      repeats: 1
sampling:
    temperature: 0
    seed: 1
    reasoning_effort: none
metrics:
    - runtime
    - gpu
    - host
