# Prepares Unsloth's UD-Q4_K_XL (already under /models/UD-Q4_K_XL) for Strata,
# following Strata's docs/UNSLOTH_Q4.md: checks the shards, packs the dense
# weights and reuses the MTP draft layer that prepare.yaml set up. The experts
# (71.7 GiB) are read from the GGUF in place and all of them are kept in RAM
# (--resident-budget-gib), so no SSD read happens per token. Needs no GPU:
#
#   kubectl apply -f runtimes/strata/prepare-ud-q4_k_xl.yaml
#   kubectl -n llm-bench logs -f job/strata-prepare-ud-q4-k-xl
apiVersion: batch/v1
kind: Job
metadata:
  name: strata-prepare-ud-q4-k-xl
  namespace: llm-bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: workload
          operator: Equal
          value: inference
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: gpu-node-02
      containers:
        - name: prepare
          image: ghcr.io/nomanoma121/strata:latest
          workingDir: /opt/strata
          command: [sh, -c]
          args:
            - |
              set -e
              cd /models/UD-Q4_K_XL
              sha256sum -c <<'SUMS'
              4448186216b3af4cc558bbce2c3213f01608f8f8b2e5267a9767971dd3ec8082  Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
              3f342f1c1580473f1ee94ddd5b28206e8c07a70fa1a366f59d1d6c922919a6c9  Qwen3.8-Flash-Next-UD-Q4_K_XL-00002-of-00004.gguf
              56758f40269cad5cd9b0d3d6fbae0f40f6d5be6de49e4ab392dbe83157d9cbd3  Qwen3.8-Flash-Next-UD-Q4_K_XL-00003-of-00004.gguf
              753bda48b98ba4f1636134a90a967de1b2d3908a236c026e464777342e53510a  Qwen3.8-Flash-Next-UD-Q4_K_XL-00004-of-00004.gguf
              SUMS
              cd /opt/strata
              .venv/bin/python tools/iq_pack.py --compat-bf16 \
                --gguf /models/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf \
                --out /models/strata/packs/ud-q4_k_xl
              mkdir -p /models/strata/config
              # The same engine settings as prepare.yaml's config, with the
              # experts read from the GGUF and all of them copied into RAM.
              .venv/bin/python - <<'PY'
              import json
              cfg = {
                  "exe": "/opt/strata/engine/strata",
                  "args": [
                      "--pack", "/models/strata/packs/ud-q4_k_xl",
                      "--native", "/models/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf",
                      "--resident-budget-gib", "80",
                      "--expert-profile", "/opt/strata/data/expert-profile.bin", "--expert-cache", "auto",
                      "--prefill", "auto", "--spec", "4", "--spec-min-p", "0.5",
                      "--mtp", "/models/strata/mtp/rt", "--max-context", "32768", "--kv", "int8",
                  ],
                  "cwd": "/opt/strata",
                  "tokenizer": "/models/strata/packs/ud-q4_k_xl/tokenizer",
                  "model_name": "qwen3.8-flash-next-ud-q4_k_xl",
                  "log": "/dev/stderr",
                  "gpu": [0, 1],
                  "layer_split": "auto",
                  "host": "127.0.0.1",
              }
              json.dump(cfg, open("/models/strata/config/strata-ud-q4_k_xl.json", "w"), indent=1)
              PY
              cat /models/strata/config/strata-ud-q4_k_xl.json
          resources:
            # Small enough to fit next to the running inference workload.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          hostPath:
            path: /var/lib/llama-cpp/models
            type: Directory
